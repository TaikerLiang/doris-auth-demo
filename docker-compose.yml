# Two independent Doris clusters, one per fab (Fab A / Fab B in docs/c4-context-poc.html).
# They share nothing: each FE has its own metadata, users and grants.

x-fe: &fe
  image: apache/doris:fe-4.1.4
  # Default fe.conf reserves an 8 GB heap (-Xms8192m), which starves BE inside Docker Desktop.
  entrypoint:
    - bash
    - -c
    - sed -i 's/-Xmx8192m -Xms8192m/-Xmx1g -Xms1g/' /opt/apache-doris/fe/conf/fe.conf && exec bash init_fe.sh
  healthcheck:
    # SHOW FRONTENDS is answered by FE alone; SELECT needs a BE in 4.x
    test: ["CMD", "mysql", "-uroot", "-P9030", "-h127.0.0.1", "-e", "SHOW FRONTENDS"]
    interval: 5s
    timeout: 5s
    retries: 60

x-be: &be
  image: apache/doris:be-4.1.4
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:8040/api/health"]
    interval: 5s
    timeout: 5s
    retries: 60

services:
  fe-a:
    <<: *fe
    hostname: fe-a
    environment:
      FE_SERVERS: fe1:172.30.80.2:9010
      FE_ID: 1
    ports:
      - "8030:8030" # FE web UI / HTTP API
      - "9030:9030" # MySQL protocol (JDBC: jdbc:mysql://localhost:9030)
    volumes:
      - fe-a-meta:/opt/apache-doris/fe/doris-meta
    networks:
      doris:
        ipv4_address: 172.30.80.2

  be-a:
    <<: *be
    hostname: be-a
    environment:
      FE_SERVERS: fe1:172.30.80.2:9010
      BE_ADDR: 172.30.80.3:9050
    ports:
      - "8040:8040"
    volumes:
      - be-a-storage:/opt/apache-doris/be/storage
    depends_on:
      fe-a:
        condition: service_healthy
    networks:
      doris:
        ipv4_address: 172.30.80.3

  fe-b:
    <<: *fe
    hostname: fe-b
    environment:
      FE_SERVERS: fe1:172.30.80.4:9010
      FE_ID: 1
    ports:
      - "8031:8030"
      - "9031:9030"
    volumes:
      - fe-b-meta:/opt/apache-doris/fe/doris-meta
    networks:
      doris:
        ipv4_address: 172.30.80.4

  be-b:
    <<: *be
    hostname: be-b
    environment:
      FE_SERVERS: fe1:172.30.80.4:9010
      BE_ADDR: 172.30.80.5:9050
    ports:
      - "8041:8040"
    volumes:
      - be-b-storage:/opt/apache-doris/be/storage
    depends_on:
      fe-b:
        condition: service_healthy
    networks:
      doris:
        ipv4_address: 172.30.80.5

  # One-shot: loads the Olist CSVs from ./data/olist into both clusters.
  loader:
    image: apache/doris:fe-4.1.4 # reused for its mysql client and curl
    entrypoint: ["bash", "/scripts/load-olist.sh", "fe-a", "fe-b"]
    volumes:
      - ./loader:/scripts:ro
      - ./data/olist:/data:ro
    depends_on:
      be-a:
        condition: service_healthy
      be-b:
        condition: service_healthy
    networks:
      - doris

  # Console DB (MariaDB 10.6, as in ADMC): permission source of truth + doris_sync_outbox
  console-db:
    image: mariadb:10.6.19
    environment:
      MARIADB_DATABASE: console
      MARIADB_USER: console
      MARIADB_PASSWORD: console
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - console-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - doris

  # Console's own Redis: scheduler locks only, never SA credentials
  console-redis:
    image: redis:7.4.2
    networks:
      - doris

  # Spring Boot console: edits Doris permissions and pushes them to each fab's Cluster API; never connects to Doris
  console:
    build: ./console
    environment:
      CONSOLE_DB_URL: jdbc:mariadb://console-db:3306/console
      CONSOLE_DB_USER: console
      CONSOLE_DB_PASSWORD: console
      CONSOLE_CRED_KEY: Zm9yLWRlbW8tb25seS1kby1ub3QtdXNlLWluLXByb2Q= # PoC only, 32 bytes
      CONSOLE_CRED_KEY_VERSION: 1
      CONSOLE_REDIS_URL: redis://console-redis:6379
      SPRING_APPLICATION_JSON: >-
        {"console": {"clusters": {"endpoints": {
          "fab-a": "http://cluster-api-a:8080",
          "fab-b": "http://cluster-api-b:8080"}}}}
    ports:
      - "8080:8080"
    stop_grace_period: 60s
    depends_on:
      console-db:
        condition: service_healthy
      console-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s # Spring Boot starts slowly when Docker Desktop is busy
    networks:
      - doris

  # Cluster layer (#10): each fab's DLH-Cluster API applies Console's desired state to its own Doris and Redis
  cluster-db:
    image: mariadb:10.6.19
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - cluster-db:/var/lib/mysql
      - ./cluster-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - doris

  # Each fab's Redis, where DAO reads SA credentials; no host port (docker compose exec redis-a redis-cli)
  redis-a:
    image: redis:7.4.2
    networks:
      - doris

  redis-b:
    image: redis:7.4.2
    networks:
      - doris

  cluster-api-a:
    build: ./cluster-api
    environment:
      CLUSTER_NAME: fab-a
      CLUSTER_DB_URL: jdbc:mariadb://cluster-db:3306/cluster_fab_a
      CLUSTER_DB_USER: cluster
      CLUSTER_DB_PASSWORD: cluster
      CLUSTER_CRED_KEY: Zm9yLWRlbW8tb25seS1jbHVzdGVyLWZhYi1hLWtleSE= # PoC only, 32 bytes, differs per fab
      CLUSTER_REDIS_URL: redis://redis-a:6379
      DORIS_FAB_A_ADMIN: "root:" # secret_ref of doris-fab-a: user:password
    ports:
      - "8091:8080"
    stop_grace_period: 60s # longer than Spring's 30s graceful shutdown, like terminationGracePeriodSeconds
    depends_on:
      cluster-db:
        condition: service_healthy
      redis-a:
        condition: service_started
    healthcheck: &cluster-api-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks:
      - doris

  cluster-api-b:
    build: ./cluster-api
    environment:
      CLUSTER_NAME: fab-b
      CLUSTER_DB_URL: jdbc:mariadb://cluster-db:3306/cluster_fab_b
      CLUSTER_DB_USER: cluster
      CLUSTER_DB_PASSWORD: cluster
      CLUSTER_CRED_KEY: Zm9yLWRlbW8tb25seS1jbHVzdGVyLWZhYi1iLWtleSE= # PoC only, 32 bytes, differs per fab
      CLUSTER_REDIS_URL: redis://redis-b:6379
      DORIS_FAB_B_ADMIN: "root:"
    ports:
      - "8092:8080"
    stop_grace_period: 60s # longer than Spring's 30s graceful shutdown, like terminationGracePeriodSeconds
    depends_on:
      cluster-db:
        condition: service_healthy
      redis-b:
        condition: service_started
    healthcheck: *cluster-api-health
    networks:
      - doris

  # End-to-end check of the permission lifecycle (#12): docker compose run --rm e2e
  # It stops and starts fab services through the Docker socket to simulate failures.
  e2e:
    build: ./e2e
    profiles: ["e2e"] # not started by docker compose up
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - doris

volumes:
  fe-a-meta:
  be-a-storage:
  fe-b-meta:
  be-b-storage:
  console-db:
  cluster-db:

networks:
  doris:
    ipam:
      config:
        - subnet: 172.30.80.0/24
          ip_range: 172.30.80.128/25 # dynamic IPs (console, cluster services, loader) stay clear of the fixed .2-.5
