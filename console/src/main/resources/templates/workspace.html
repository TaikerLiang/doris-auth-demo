<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head th:replace="~{fragments :: head(${workspace})}"></head>
<body>
<header th:replace="~{fragments :: nav('workspaces')}"></header>
<main>
  <div th:replace="~{fragments :: flash}"></div>
  <section class="page-head">
    <a class="crumb" th:href="@{/workspaces}">← Workspaces</a>
    <h1 th:text="${workspace}">workspace</h1>
    <p th:text="'已在 ' + ${#lists.size(opened)} + ' / ' + ${fabCount} + ' 個 fab 開通 doris path。點 fab 管理該 fab 的授權。'">已開通</p>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
      <tr><th>Fab</th><th>Doris instance</th><th>SA</th><th>授權</th></tr>
      </thead>
      <tbody>
      <tr th:each="r : ${opened}">
        <td><a class="fab" th:href="@{/workspaces/{w}/fabs/{c}(w=${workspace},c=${r.clusterName})}"
               th:text="${r.clusterName}">fab-a</a></td>
        <td class="nowrap">
          <span th:text="${r.host?.instanceName}">doris</span>
          <div class="sub"><code th:text="${r.host?.feHost} + ':' + ${r.host?.queryPort}">fe:9030</code></div>
        </td>
        <td class="nowrap" th:text="${r.saCount} + ' 個'">0 個</td>
        <td class="nowrap" th:text="${r.grantCount} + ' 筆'">0 筆</td>
      </tr>
      <tr th:if="${#lists.isEmpty(opened)}"><td colspan="4" class="muted">還沒有在任何 fab 開通 doris path</td></tr>
      </tbody>
    </table>
  </div>

  <section class="card">
    <div class="card-head"><h2>開通新的 fab</h2></div>
    <p class="muted" th:if="${#maps.isEmpty(openChoices)}">
      已在所有登記了 Doris host 的 fab 開通。新的 fab 要先到 <a th:href="@{/hosts}">Doris Hosts</a> 登記。
    </p>
    <form class="inline" method="post" th:unless="${#maps.isEmpty(openChoices)}"
          th:action="@{/workspaces/{w}/paths(w=${workspace})}">
      <label>Fab / Doris host
        <select name="hostId">
          <optgroup th:each="e : ${openChoices}" th:label="${e.key}">
            <option th:each="h : ${e.value}" th:value="${h.id}"
                    th:text="${e.key} + ' · ' + ${h.instanceName} + ' (' + ${h.feHost} + ':' + ${h.queryPort} + ')'">doris</option>
          </optgroup>
        </select>
      </label>
      <button type="submit">開通 doris path</button>
    </form>
    <p class="hint">開通 doris path 後，再到該 fab 的頁面新增 SA。只列出還沒開通的 fab。</p>
  </section>
</main>
</body>
</html>
